<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAFU 2026 v1 &ndash; Process datasets</title>
<link rel="stylesheet" href="/bafu-dev/assets/style.css">
</head>
<body>
<h1>BAFU 2026 v1 &ndash; Process datasets</h1>
<p id="count">Loading&hellip;</p>
<div id="controls">
  <input type="search" id="q" placeholder="Search name, UUID, category, subcategory&hellip;" aria-label="Search processes">
  <select id="location" aria-label="Filter by location"><option value="">Location: all</option></select>
  <select id="unit" aria-label="Filter by reference unit"><option value="">Unit: all</option></select>
  <select id="category" aria-label="Filter by category"><option value="">Category: all</option></select>
  <select id="subcategory" aria-label="Filter by subcategory"><option value="">Subcategory: all</option></select>
  <select id="sort" aria-label="Sort by">
    <option value="name">Sort: name</option>
    <option value="location">Sort: location</option>
    <option value="unit">Sort: reference unit</option>
    <option value="category">Sort: category</option>
    <option value="subcategory">Sort: subcategory</option>
    <option value="start">Sort: start date</option>
    <option value="uuid">Sort: UUID</option>
  </select>
  <label><input type="checkbox" id="desc"> descending</label>
</div>
<table id="tbl">
  <thead>
    <tr>
      <th data-key="name">Name</th>
      <th data-key="location">Location</th>
      <th data-key="unit">Reference unit</th>
      <th data-key="category">Category</th>
      <th data-key="subcategory">Subcategory</th>
      <th data-key="start">Start</th>
      <th data-key="uuid">UUID</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<div id="pagination"></div>
<script src="/bafu-dev/assets/app.js"></script>
</body>
</html>
